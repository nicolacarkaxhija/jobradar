# Copy to .github/workflows/draft.yml in your PRIVATE data repo.
#
# Write an application draft for any listing already in the DB — including the
# digest-tier ones that scored below the push threshold and so were never
# drafted automatically. Actions -> draft -> Run workflow, paste the URL.
name: draft

on:
  workflow_dispatch:
    inputs:
      listing:
        description: listing URL (or an id prefix of at least 8 chars)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jobradar # shares the DB with the poll workflow — never run in parallel
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine
        run: pip install "jobradar @ git+https://github.com/nicolacarkaxhija/jobradar@main"

      # the URL is untrusted input — it must reach bash as a value, never as script source
      - name: Draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LISTING: ${{ inputs.listing }}
        run: jobradar draft "$LISTING" --config config.yaml

      - name: Commit
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ drafts/
          if ! git diff --cached --quiet; then
            git commit -m "chore(draft): on-demand draft"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
