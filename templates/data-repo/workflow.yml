# Copy to .github/workflows/jobradar.yml in your PRIVATE data repo.
#
# Schedule (UTC): six polls across CET waking hours. The digest is gated on
# WHICH cron fired (github.event.schedule), not the runner's wall clock —
# GitHub routinely starts scheduled runs late, and a delayed 18:00 run must
# still send the day's digest.
name: jobradar

on:
  schedule:
    - cron: "0 4,7,10,13,15 * * *"
    - cron: "0 18 * * *" # digest run (19:00/20:00 CET)
  workflow_dispatch:
    inputs:
      digest:
        description: force a digest with this run
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jobradar
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # no `cache: pip` here — the data repo has no requirements/pyproject file,
      # and setup-python's pip cache errors out without one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine
        run: pip install "jobradar[jobspy] @ git+https://github.com/nicolacarkaxhija/jobradar@main"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          DIGEST=""
          if [ "${{ github.event.schedule }}" = "0 18 * * *" ] || [ "${{ inputs.digest }}" = "true" ]; then
            DIGEST="--digest"
          fi
          jobradar run --config config.yaml $DIGEST

      - name: Commit state
        if: always() # listings fetched from healthy sources are kept even when a source failed
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          for d in data archive drafts; do
            [ -d "$d" ] && git add "$d"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: run $(date -u +'%Y-%m-%d %H:%M')"
            # the repo may have advanced mid-run (e.g. the track workflow) — rebase, then push
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
