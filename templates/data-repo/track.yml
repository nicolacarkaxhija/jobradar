# Copy to .github/workflows/track.yml in your PRIVATE data repo.
#
# Mark application progress from the GitHub Actions UI (works from a phone):
# Actions -> track -> Run workflow -> paste the listing URL, pick a status.
name: track

on:
  workflow_dispatch:
    inputs:
      listing:
        description: listing URL (or an id prefix of at least 8 chars)
        required: true
        type: string
      status:
        description: application status
        required: true
        type: choice
        options: [applied, interviewing, offer, rejected, ghosted]
      note:
        description: optional note
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: jobradar # shares the DB with the poll workflow — never run in parallel
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine
        run: pip install "jobradar @ git+https://github.com/nicolacarkaxhija/jobradar@main"

      # Free-text inputs go through env, never into the script source: listing URLs
      # come from public boards and LLM extraction, so `${{ }}` interpolation here
      # would be a command-injection sink. `status` is a choice, validated by GitHub.
      - name: Track
        env:
          LISTING: ${{ inputs.listing }}
          NOTE: ${{ inputs.note }}
        run: jobradar track "$LISTING" "${{ inputs.status }}" --note "$NOTE" --config config.yaml

      - name: Commit
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ TRACKING.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(track): ${{ inputs.status }}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
