name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest
